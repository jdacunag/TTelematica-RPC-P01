syntax = "proto3";

package operations;

// Servicio específico para operaciones de suma
service SumService {
  // Operación síncrona de suma
  rpc Sum(SumRequest) returns (SumResponse) {}
  
  // Verificación de estado del servicio
  rpc CheckStatus(StatusRequest) returns (StatusResponse) {}
  
  // Consulta de estado de una operación asíncrona
  rpc GetAsyncOperationStatus(AsyncOperationRequest) returns (AsyncOperationResponse) {}
}

// Solicitud para operaciones de suma
message SumRequest {
  int32 a = 1;
  int32 b = 2;
  string operation_id = 3;  // ID único para rastrear la operación
}

// Respuesta para operaciones de suma
message SumResponse {
  int32 result = 1;
  bool success = 2;
  string error_message = 3;
  string operation_id = 4;  // Mismo ID que en la solicitud
}

// Solicitud para verificar el estado del servicio
message StatusRequest {
  string service_id = 1;  // Identificador del servicio
}

// Respuesta del estado del servicio
message StatusResponse {
  enum ServiceStatus {
    UNKNOWN = 0;
    RUNNING = 1;
    DEGRADED = 2;
    DOWN = 3;
  }
  ServiceStatus status = 1;
  string message = 2;
  int32 uptime = 3;  // Tiempo de actividad en segundos
}

// Solicitud para consultar estado de operación asíncrona
message AsyncOperationRequest {
  string operation_id = 1;  // ID de la operación asíncrona
}

// Respuesta con el estado de operación asíncrona
message AsyncOperationResponse {
  enum OperationStatus {
    UNKNOWN = 0;
    PENDING = 1;
    PROCESSING = 2;
    COMPLETED = 3;
    FAILED = 4;
    CANCELLED = 5;
  }
  OperationStatus status = 1;
  SumResponse result = 2;  // Resultado si está completado
  string message = 3;  // Mensaje informativo o de error
}