syntax = "proto3";

package operations;

// Servicio específico para operaciones de suma
service SumService {
  // Operación síncrona de suma
  rpc Sum(SumRequest) returns (SumResponse) {}
  
  // Verificación de estado del servicio
  rpc CheckStatus(StatusRequest) returns (StatusResponse) {}
  
  // Consulta de estado de una operación asíncrona
  rpc GetAsyncOperationStatus(AsyncOperationRequest) returns (AsyncOperationResponse) {}
}

// Servicio específico para operaciones de resta
service SubtractService {
  // Operación síncrona de resta
  rpc Subtract(SubtractRequest) returns (SubtractResponse) {}
  
  // Verificación de estado del servicio
  rpc CheckStatus(StatusRequest) returns (StatusResponse) {}
  
  // Consulta de estado de una operación asíncrona
  rpc GetAsyncOperationStatus(AsyncOperationRequest) returns (AsyncOperationResponse) {}
}

// Mensajes comunes para todos los servicios
message StatusRequest {
  string service_id = 1;  // Identificador del servicio
}

message StatusResponse {
  enum ServiceStatus {
    UNKNOWN = 0;
    RUNNING = 1;
    DEGRADED = 2;
    DOWN = 3;
  }
  ServiceStatus status = 1;
  string message = 2;
  int32 uptime = 3;  // Tiempo de actividad en segundos
}

message AsyncOperationRequest {
  string operation_id = 1;  // ID de la operación asíncrona
}

message AsyncOperationResponse {
  enum OperationStatus {
    UNKNOWN = 0;
    PENDING = 1;
    PROCESSING = 2;
    COMPLETED = 3;
    FAILED = 4;
    CANCELLED = 5;
  }
  OperationStatus status = 1;
  OperationResult result = 2;  // Resultado genérico si está completado
  string message = 3;  // Mensaje informativo o de error
}

// Resultado genérico para cualquier operación
message OperationResult {
  int32 result = 1;
  bool success = 2;
  string error_message = 3;
  string operation_id = 4;
}

// Mensajes específicos para el servicio de suma
message SumRequest {
  int32 a = 1;
  int32 b = 2;
  string operation_id = 3;  // ID único para rastrear la operación
}

message SumResponse {
  int32 result = 1;
  bool success = 2;
  string error_message = 3;
  string operation_id = 4;  // Mismo ID que en la solicitud
}

// Mensajes específicos para el servicio de resta
message SubtractRequest {
  int32 a = 1;
  int32 b = 2;
  string operation_id = 3;  // ID único para rastrear la operación
}

message SubtractResponse {
  int32 result = 1;
  bool success = 2;
  string error_message = 3;
  string operation_id = 4;  // Mismo ID que en la solicitud
}